# Z.ai (GLM) overlay. Copy to config/local.toml (gitignored) or:
#   export R2D2_CONFIG=/path/to/this/file
#   export ZAI_API_KEY=...          # never commit the key
#   echo 'ZAI_API_KEY=...' >> .env  # gitignored, auto-loaded
#
# General (prepaid) keys: https://api.z.ai/api/paas/v4/          model glm-5.2
# Coding-plan keys:       https://api.z.ai/api/coding/paas/v4/   model glm-5.3
# Same key format either way ({id}.{secret}). Error 1113 on /paas/v4 with a
# valid key usually means the key is a Coding Plan key — switch host + model.
# Coding-plan models: glm-5.3, glm-5-turbo, glm-4.7 (not glm-5.2).

[llm]
provider = "openai"
model = "glm-5.3"
api_key_env = "ZAI_API_KEY"
openai_base_url = "https://api.z.ai/api/coding/paas/v4/"
enable_fallback = false
temperature = 0.2
max_tokens = 2048
compact_context = true
